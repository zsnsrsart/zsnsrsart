<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @media only screen and (orientation: portrait) {
            body, html {

                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color:  #ffa500;
                background-image: url("task.webp");
                min-height: 50rem;
                background-size: contain;
                background-attachment: fixed;
                background-position: 0 0;
                background-repeat: no-repeat;
            }

            h1 {
                position: relative;
                display: block;
                top: 5rem;
                width: calc(100% - 21%);
                margin-left: 10%;
                font-size: 150%;
                text-align: center;
                color: #5d3fd3;
                font-family: Arial, Helvetica, sans-serif;
            }
            p {
                position: relative;
                display: block;
                width: calc(100% - 10%);
                margin-left: 5%;
                top: 9rem;
                font-size: 125%;
                text-align: center;
                margin-bottom: 1.5rem;
                color: #5d3fd3;
                font-family: Arial, Helvetica, sans-serif;

            }
            
        }

        /* vodoravno*/
        @media screen and (orientation: landscape) {
            body {
                background-image: url("task.webp");
                min-height: 34rem;
                background-size: contain;
                background-attachment: fixed;
                background-position: 50% 50%;
                background-repeat: no-repeat;
                background-color: #ffa500;
            }

            h1 {
                position: relative;
                display: block;
                width: calc(100% - 21%);
                margin-left: 10%;
                top: 20rem;
                font-size: 150%;
                text-align: center;
                color: #5d3fd3;
                font-family: Arial, Helvetica, sans-serif;
            }
            p {
                 position: relative;
                display: block;
                width: calc(100% - 10%);
                margin-left: 5%;
                top: 20.02rem;
                font-size: 125%;
                text-align: center;
                margin-bottom: 1.5rem;
                color: #5d3fd3;
                font-family: Arial, Helvetica, sans-serif;

            }
        }
        </style>
</head>

<body>

    <header>
     <h1>Dobro Došli Na Moj Sajt O Slikarstvu Za Vas.</h1>
        <p class="naslovnitekst1">Sajt Je Trenutno U Izradi, Ali Se Iza Kulisa Već Pripremaju Crteži, Slike, Biografije i Programerski Kodovi. Vidimo Se Uskoro !</p>

    </header>
     </main>


    </main>
    <aside></aside>
    <footer></footer>

</body>

</html>
